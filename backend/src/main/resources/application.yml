spring:
  config:
    # Prefer repo-root env when running from backend/; also allow cwd-relative for IDE/root runs.
    import: optional:file:../.env.properties,optional:file:.env.properties
  application:
    name: e-wallet
  main:
    banner-mode: console
  banner:
    location: classpath:/banner.txt
  output:
    ansi:
      enabled: always
  jackson:
    date-format: 'dd.MM.yyyy'
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/${db_name}
    username: ${db_username}
    password: ${db_password}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      open-in-view: false
      generate-ddl: true
  flyway:
    enabled: true
    placeholderReplacement: false
    baseline-on-migrate: true
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB

logging:
  file:
    name: './logs/application.log'
    logback:
      rollingpolicy:
        max-file-size: 1MB
        total-size-cap: 10MB
        max-history: 30
        clean-history-on-start: true
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){blue} %clr(%-5p) %clr(${PID}){faint} %clr(---){faint} %clr([%8.15t]){faint} %clr(%-40.40logger{0}){cyan} %clr(:){faint} %clr(%m){faint}%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  level:
    com.ros.ewallet: debug
    org.springframework: warn
    org.hibernate: error
    org.springframework.security: error

server:
  port: 8080
  # Default 8KB is often exceeded on localhost when many cookies share :8080
  max-http-request-header-size: 64KB
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

exception:
  trace: false

app:
  security:
    jwtSecret: ${jwt_secret}
    jwtExpirationMs: 900000
    jwtRefreshExpirationMs: 604800000
    cookieSecure: false
    cors:
      allowed-origins: ${cors_allowed_origins:http://localhost:3000,http://localhost:3001}
  # Transactional limits (VND). Day boundary: Asia/Ho_Chi_Minh.
  limits:
    per-transaction-max: 50000000
    daily-outbound-max: 100000000
    daily-top-up-max: 100000000
    dual-control-threshold: 10000000
    reverse-window-hours: 72
  # Lifetime transaction subscription allotment for new organizations.
  subscription:
    default-transaction-quota: 1000
